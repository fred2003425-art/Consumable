<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consumable 真超級天書</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            theme: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-purple-50/50 min-h-screen text-slate-800 pb-12">

  <!-- 1. 密碼驗證遮罩 -->
  <div id="authOverlay" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
      <div class="w-16 h-16 bg-theme-100 text-theme-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fas fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-800 mb-1">公司專屬零食目錄</h2>
      <p class="text-xs text-slate-500 mb-6">受保護的內部系統，請輸入密碼以解鎖</p>
      
      <form id="authForm" onsubmit="unlockSystem(event)" class="space-y-4">
        <div>
          <input type="password" id="accessPassword" placeholder="請輸入通行密碼 (111)" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-theme-400 text-sm text-center">
        </div>
        <p id="passwordError" class="text-xs text-rose-500 hidden"><i class="fas fa-exclamation-circle mr-1"></i>密碼不正確！</p>
        <button type="submit" class="w-full bg-theme-500 hover:bg-theme-600 text-white font-medium py-2.5 rounded-xl shadow-sm text-sm transition">
          進入系統
        </button>
      </form>
    </div>
  </div>

  <!-- 2. 主系統內容 -->
  <div id="appContent" class="hidden">
    <header class="bg-theme-300 text-slate-800 shadow-sm sticky top-0 z-30 border-b border-theme-200">
      <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
          <div class="bg-white/60 p-2.5 rounded-xl text-2xl shadow-sm">🍿</div>
          <div>
            <h1 class="text-xl font-bold text-slate-900">雲端即時同步零食目錄</h1>
            <p class="text-xs text-slate-600">跨裝置同步 · 4000 固定前綴編號</p>
          </div>
        </div>
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <button onclick="openModal()" class="flex-1 sm:flex-none bg-theme-600 hover:bg-theme-700 text-white font-medium px-5 py-2.5 rounded-xl shadow-sm flex items-center justify-center space-x-2 transition text-sm">
            <i class="fas fa-plus"></i>
            <span>新增零食貨品</span>
          </button>
          <button onclick="lockSystem()" class="bg-white/80 hover:bg-white text-slate-700 p-2.5 rounded-xl shadow-sm transition border border-theme-200" title="安全登出">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-purple-100 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
        <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto flex-1 max-w-3xl items-center">
          <div class="relative flex-1 w-full">
            <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="搜尋 12 位編號或零食簡稱..." oninput="changeFilter()" class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-theme-300 text-sm">
          </div>
          <select id="categoryFilter" onchange="changeFilter()" class="px-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-theme-300 text-sm bg-white w-full sm:w-auto">
            <option value="">所有自訂類別</option>
          </select>
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <span class="text-xs text-slate-500 whitespace-nowrap">每頁顯示:</span>
            <select id="itemsPerPageSelect" onchange="changeFilter()" class="px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-theme-300 text-sm bg-white w-full sm:w-auto">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="4" selected>4</option>
              <option value="6">6</option>
              <option value="8">8</option>
            </select>
          </div>
        </div>
      </div>

      <div id="itemsContainer"></div>
      <div id="paginationContainer" class="flex justify-center items-center gap-2 mt-6 pb-6"></div>
    </main>

    <!-- 新增 / 編輯 Modal 視窗 -->
    <div id="itemModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
      <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-xl">
        <div class="p-5 border-b border-purple-100 flex justify-between items-center sticky top-0 bg-white z-10">
          <h3 id="modalTitle" class="text-lg font-bold text-slate-800">新增零食貨品</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100"><i class="fas fa-times"></i></button>
        </div>
        <form id="itemForm" onsubmit="saveItem(event)" class="p-5 space-y-4">
          <input type="hidden" id="editingItemId">
          
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">1. 貨品編號 (4000 + 自行輸入 8 位數字) *</label>
            <div id="codeContainer" class="flex items-center border border-slate-200 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-theme-300 transition-colors">
              <span class="bg-theme-100 text-theme-800 px-3.5 py-2 font-mono font-bold border-r border-slate-200 text-sm">4000</span>
              <input type="text" id="itemSuffix" maxlength="8" placeholder="輸入後8位數字" oninput="validateSuffixInput()" required class="flex-1 px-3 py-2 text-sm font-mono tracking-wider focus:outline-none">
            </div>
            <p id="codeError" class="text-xs text-rose-500 mt-1 hidden">請輸入剛好 8 位純數字</p>
            <p id="duplicateError" class="text-xs text-rose-500 mt-1 hidden font-medium"><i class="fas fa-exclamation-triangle mr-1"></i>此貨品編號已存在，請使用其他編號！</p>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">2. 貨品簡稱 *</label>
            <input type="text" id="itemName" placeholder="例如：手工特濃雪花酥" required class="w-full px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-theme-300 text-sm">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">3. 選擇或輸入零食類別 *</label>
            <select id="itemCategorySelect" onchange="handleCategorySelectChange()" class="w-full px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-theme-300 text-sm bg-white mb-2">
              <option value="">-- 請選擇已保存的類別 --</option>
              <option value="__NEW__">+ 新增自訂類別...</option>
            </select>
            <input type="text" id="itemCustomCategory" placeholder="請輸入新類別名稱" class="w-full px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-theme-300 text-sm hidden">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">4. 內容物件數 *</label>
            <input type="text" id="itemPieceCount" placeholder="例如：12 獨立包 / 8 粒裝" required class="w-full px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-theme-300 text-sm">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">5. 商品封面圖片 (可貼網址、上傳圖片或直接 CTRL+V 貼上截圖)</label>
            <input type="url" id="itemImage" placeholder="https://... 或下方直接選擇檔案/貼上截圖" onchange="previewImageSrc(this.value)" class="w-full px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-theme-300 text-sm mb-2">
            
            <div class="flex items-center gap-2 mb-2">
              <label class="cursor-pointer bg-purple-50 hover:bg-purple-100 text-theme-700 text-xs px-3 py-2 rounded-xl border border-purple-200 flex items-center gap-1.5 transition">
                <i class="fas fa-upload"></i>
                <span>上傳本地照片</span>
                <input type="file" id="imageFileInput" accept="image/*" onchange="handleFileUpload(event)" class="hidden">
              </label>
              <span class="text-xs text-slate-400">或在此視窗按下 Ctrl+V 貼上剪貼簿截圖</span>
            </div>

            <!-- 預覽圖區塊 -->
            <div id="imagePreviewContainer" class="hidden relative rounded-xl
