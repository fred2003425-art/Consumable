<!DOCTYPE html><html lang="zh-Hant"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>零食貨品目錄系統 (雲端同步版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            theme: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style></head><body class="bg-purple-50/50 min-h-screen text-slate-800 pb-12">

  <!-- 1. 密碼驗證遮罩 -->
  <div id="authOverlay" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
      <div class="w-16 h-16 bg-theme-100 text-theme-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fas fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-800 mb-1">公司專屬零食目錄</h2>
      <p class="text-xs text-slate-500 mb-6">受保護的內部系統，請輸入密碼以解鎖</p>
      
      <form onsubmit="unlockSystem(event)" class="space-y-4">
        <div>
          <input type="password" id="accessPassword" placeholder="請輸入通行密碼" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-theme-400 text-sm text-center">
        </div>
        <p id="passwordError" class="text-xs text-rose-500 hidden"><i class="fas fa-exclamation-circle mr-1"></i>密碼不正確！</p>
        <button type="submit" class="w-full bg-theme-500 hover:bg-theme-600 text-white font-medium py-2.5 rounded-xl shadow-sm text-sm transition">
          進入系統
        </button>
      </form>
    </div>
  </div>

  <!-- 2. 主系統內容 -->
  <div id="appContent" class="hidden">
    <header class="bg-theme-300 text-slate-800 shadow-sm sticky top-0 z-30 border-b border-theme-200">
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
        <div class="flex items-center space-x-3">
          <div class="bg-white/60 p-2 rounded-xl text-xl shadow-sm">🍿</div>
          <div>
            <h1 class="text-lg font-bold text-slate-900">雲端即時同步零食目錄</h1>
            <p class="text-[11px] text-slate-600">跨裝置同步 · 4000 固定前綴編號</p>
          </div>
        </div>
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <button onclick="openModal()" class="flex-1 sm:flex-none bg-theme-600 hover:bg-theme-700 text-white font-medium px-4 py-2 rounded-xl shadow-sm flex items-center justify-center space-x-2 transition text-xs">
            <i class="fas fa-plus"></i>
            <span>新增零食貨品</span>
          </button>
          <button onclick="lockSystem()" class="bg-white/80 hover:bg-white text-slate-700 p-2 rounded-xl shadow-sm transition border border-theme-200 text-xs" title="安全登出">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-4">
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-purple-100 mb-4 flex flex-col md:flex-row gap-3 justify-between items-center">
        <div class="flex flex-col sm:flex-row gap-2.5 w-full md:w-auto flex-1 max-w-3xl items-center flex-wrap">
          <div class="relative flex-1 min-w-[180px] w-full">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" id="searchInput" placeholder="搜尋 12 位編號或零食簡稱..." oninput="changeFilter()" class="w-full pl-9 pr-3 py-1.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-theme-300 text-xs">
          </div>
          <select id="categoryFilter" onchange="changeFilter()" class="px-3 py-1.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-theme-300 text-xs bg-white w-full sm:w-auto">
            <option value="">所有自訂類別</option>
          </select>
          <div class="flex items-center gap-1.5 w-full sm:w-auto mt-1 sm:mt-0">
            <span class="text-xs text-slate-500 whitespace-nowrap">每頁顯示:</span>
            <select id="itemsPerPageSelect" onchange="changeFilter()" class="px-2.5 py-1.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-theme-300 text-xs bg-white">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="4" selected>4</option>
              <option value="8">8</option>
            </select>
          </div>
        </div>
      </div>

      <div id="itemsContainer"></div>
      <div id="paginationContainer" class="flex justify-center items-center gap-2 mt-4 pb-4"></div>
    </main>

    <!-- 新增 / 編輯 Modal 視窗 -->
    <div id="itemModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
      <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-xl">
        <div class="p-4 border-b border-purple-100 flex justify-between items-center sticky top-0 bg-white z-10">
          <h3 id="modalTitle" class="text-base font-bold text-slate-800">新增零食貨品</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-base w-7 h-7 flex items-center justify-center rounded-full hover:bg-slate-100"><i class="fas fa-times"></i></button>
        </div>
        <form id="itemForm" onsubmit="saveItem(event)" class="p-4 space-y-3">
          <input type="hidden" id="editingItemId">
          
          <div>
1.             <label class="block text-xs font-bold text-slate-700 uppercase mb-1">貨品編號 (4000 + 自行輸入 8 位數字) *
</label>
            <div id="codeContainer" class="flex items-center border border-slate-200 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-theme-300 transition-colors">
              <span class="bg-theme-100 text-theme-800 px-3 py-1.5 font-mono font-bold border-r border-slate-200 text-xs">4000</span>
              <input type="text" id="itemSuffix" maxlength="8" placeholder="輸入後8位數字" oninput="validateSuffixInput()" required class="flex-1 px-2.5 py-1.5 text-xs font-mono tracking-wider focus:outline-none">
            </div>
            <p id="codeError" class="text-xs text-rose-500 mt-1 hidden">請輸入剛好 8 位純數字</p>
            <p id="duplicateError" class="text-xs text-rose-500 mt-1 hidden font-medium"><i class="fas fa-exclamation-triangle mr-1"></i>此貨品編號已存在，請使用其他編號！</p>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">2. 貨品簡稱 *</label>
            <input type="text" id="itemName" placeholder="例如：手工特濃雪花酥" required class="w-full px-3 py-1.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-theme-300 text-xs">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">3. 選擇或輸入零食類別 *</label>
            <select id="itemCategorySelect" onchange="handleCategorySelectChange()" class="w-full px-3 py-1.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-theme-300 text-xs bg-white mb-1.5">
              <option value="">-- 請選擇已保存的類別 --</option>
              <option value="__NEW__">+ 新增自訂類別...</option>
            </select>
            <input type="text" id="itemCustomCategory" placeholder="請輸入新類別名稱" class="w-full px-3 py-1.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-theme-300 text-xs hidden">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">4. 內容物件數 *</label>
            <input type="text" id="itemPieceCount" placeholder="例如：12 獨立包 / 8 粒裝" required class="w-full px-3 py-1.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-theme-300 text-xs">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">5. 商品封面圖片 (可貼網址、上傳圖片或直接 CTRL+V 貼上截圖)</label>
            <input type="url" id="itemImage" placeholder="https://... 或下方選擇檔案/貼上截圖" onchange="previewImageSrc(this.value)" class="w-full px-3 py-1.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-theme-300 text-xs mb-1.5">
            
            <div class="flex items-center gap-2 mb-1.5">
              <label class="cursor-pointer bg-purple-50 hover:bg-purple-100 text-theme-700 text-[11px] px-2.5 py-1.5 rounded-xl border border-purple-200 flex items-center gap-1 transition">
                <i class="fas fa-upload"></i>
                <span>上傳本地照片</span>
                <input type="file" id="imageFileInput" accept="image/*" onchange="handleFileUpload(event)" class="hidden">
              </label>
              <span class="text-[11px] text-slate-400">或在此視窗按下 Ctrl+V 貼上截圖</span>
            </div>

            <div id="imagePreviewContainer" class="hidden relative rounded-xl border border-slate-200 overflow-hidden h-28 bg-slate-50">
              <img id="imagePreview" src="" class="w-full h-full object-contain">
              <button type="button" onclick="clearImagePreview()" class="absolute top-1.5 right-1.5 bg-slate-900/70 hover:bg-slate-900 text-white w-5 h-5 rounded-full text-[10px] flex items-center justify-center">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>

          <div class="pt-2 border-t border-purple-100 flex justify-end space-x-2">
            <button type="button" onclick="closeModal()" class="px-3.5 py-1.5 border border-slate-200 rounded-xl text-slate-600 text-xs font-medium">取消</button>
            <button type="submit" id="saveBtn" class="px-4 py-1.5 bg-theme-500 hover:bg-theme-600 text-white rounded-xl text-xs font-medium transition-all">儲存至雲端</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    // 🔒 系統通行密碼
    const SYSTEM_PASSWORD = "111";

    // 🎯 Firebase 設定金鑰
    const firebaseConfig = {
      apiKey: "AIzaSyDPB0jYf7DpeS61OvoLjpXZLjlY3mHcde8",
      authDomain: "consumables-c799c.firebaseapp.com",
      databaseURL: "https://consumables-c799c-default-rtdb.firebaseio.com",
      projectId: "consumables-c799c",
      storageBucket: "consumables-c799c.firebasestorage.app",
      messagingSenderId: "228134507402",
      appId: "1:228134507402:web:29bc8efbb802cad8e32e73",
      measurementId: "G-TFLTQX4PK2"
    };

    let db;
    let items = [];
    let currentBase64Image = '';
    let currentPage = 1;

    window.onload = function() {
      if (sessionStorage.getItem('snack_app_auth') === 'true') {
        initDatabase();
      }
      window.addEventListener('paste', handlePasteImage);
    };

    function unlockSystem(e) {
      e.preventDefault();
      if (document.getElementById('accessPassword').value === SYSTEM_PASSWORD) {
        sessionStorage.setItem('snack_app_auth', 'true');
        initDatabase();
      } else {
        document.getElementById('passwordError').classList.remove('hidden');
      }
    }

    function lockSystem() {
      sessionStorage.removeItem('snack_app_auth');
      location.reload();
    }

    function initDatabase() {
      document.getElementById('authOverlay').classList.add('hidden');
      document.getElementById('appContent').classList.remove('hidden');

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database().ref('snacks');

      db.on('value', (snapshot) => {
        const data = snapshot.val();
        items = [];
        if (data) {
          Object.keys(data).forEach(key => items.push({ id: key, ...data[key] }));
        }
        updateCategoryOptions();
        renderItems();
        validateSuffixInput();
      });
    }

    function updateCategoryOptions() {
      const categories = [...new Set(items.map(i => i.category))].filter(Boolean);
      
      const filter = document.getElementById('categoryFilter');
      const currentFilter = filter.value;
      filter.innerHTML = '<option value="">所有自訂類別</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');
      filter.value = currentFilter;

      const select = document.getElementById('itemCategorySelect');
      const currentSelect = select.value;
      select.innerHTML = '<option value="">-- 請選擇已保存的類別 --</option>' +
                         categories.map(c => `<option value="${c}">${c}</option>`).join('') +
                         '<option value="__NEW__">+ 新增自訂類別...</option>';
      select.value = currentSelect;
    }

    function handleCategorySelectChange() {
      const select = document.getElementById('itemCategorySelect');
      const customInput = document.getElementById('itemCustomCategory');

      if (select.value === '__NEW__') {
        customInput.classList.remove('hidden');
        customInput.required = true;
        customInput.focus();
      } else {
        customInput.classList.add('hidden');
        customInput.required = false;
        customInput.value = '';
      }
    }

    function validateSuffixInput() {
      const input = document.getElementById('itemSuffix');
      const editId = document.getElementById('editingItemId').value;
      const codeError = document.getElementById('codeError');
      const duplicateError = document.getElementById('duplicateError');
      const codeContainer = document.getElementById('codeContainer');
      const saveBtn = document.getElementById('saveBtn');

      input.value = input.value.replace(/\D/g, '');
      const suffixVal = input.value.trim();

      codeError.classList.add('hidden');
      duplicateError.classList.add('hidden');
      codeContainer.classList.remove('border-rose-500', 'ring-2', 'ring-rose-500');

      if (suffixVal.length > 0 && suffixVal.length < 8) {
        codeError.classList.remove('hidden');
        return false;
      }

      if (suffixVal.length === 8) {
        const fullCode = ('4000' + suffixVal).trim();

        const isDuplicate = items.some(item => {
          const itemCode = (item.code || '').toString().trim();
          return itemCode === fullCode && item.id !== editId;
        });

        if (isDuplicate) {
          duplicateError.classList.remove('hidden');
          codeContainer.classList.add('border-rose-500', 'ring-2', 'ring-rose-500');
          saveBtn.disabled = true;
          saveBtn.classList.add('opacity-50', 'cursor-not-allowed');
          return false;
        }
      }

      saveBtn.disabled = false;
      saveBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      return suffixVal.length === 8;
    }

    function changeFilter() {
      currentPage = 1;
      renderItems();
    }

    function renderItems() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const catFilter = document.getElementById('categoryFilter').value;
      const itemsPerPage = parseInt(document.getElementById('itemsPerPageSelect').value) || 4;

      const filtered = items.filter(item => {
        const matchesSearch = (item.name || '').toLowerCase().includes(search) || (item.code || '').toLowerCase().includes(search);
        const matchesCat = !catFilter || item.category === catFilter;
        return matchesSearch && matchesCat;
      });

      const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * itemsPerPage;
      const paginatedItems = filtered.slice(start, start + itemsPerPage);

      const container = document.getElementById('itemsContainer');
      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-12 bg-white rounded-2xl border border-purple-100"><p class="text-slate-500 text-xs">目前沒有符合條件的零食貨品</p></div>`;
        document.getElementById('paginationContainer').innerHTML = '';
        return;
      }

      // 🎯 優化：改為精簡型小尺寸卡片佈局，圖片高度由 h-48 縮減為 h-28，更利於快速瀏覽
      container.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3.5">` + paginatedItems.map(item => `
        <div class="bg-white rounded-xl border border-purple-100 overflow-hidden shadow-sm hover:shadow-md transition">
          <div class="h-28 bg-slate-100 relative">
            <img src="${item.image || 'https://via.placeholder.com/300?text=No+Image'}" class="w-full h-full object-cover">
            <span class="absolute top-2 left-2 bg-slate-900/80 text-theme-200 text-[9px] font-mono font-bold px-2 py-0.5 rounded-md">${item.code}</span>
            <span class="absolute top-2 right-2 bg-theme-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-md">${item.category}</span>
          </div>
          <div class="p-2.5">
            <h3 class="font-bold text-slate-800 text-xs truncate mb-0.5" title="${item.name}">${item.name}</h3>
            <p class="text-[11px] text-slate-500 mb-2 truncate"><i class="fas fa-box-open mr-1"></i>件數：${item.pieceCount}</p>
            <div class="flex justify-end items-center gap-1.5 pt-1.5 border-t border-purple-50">
              <button onclick="editItem('${item.id}')" class="px-2 py-1 bg-theme-50 hover:bg-theme-100 text-theme-700 text-[10px] font-medium rounded-md transition flex items-center gap-1">
                <i class="fas fa-edit"></i> 編輯
              </button>
              <button onclick="deleteItem('${item.id}')" class="px-2 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 text-[10px] font-medium rounded-md transition flex items-center gap-1">
                <i class="fas fa-trash"></i> 刪除
              </button>
            </div>
          </div>
        </div>
      `).join('') + `</div>`;

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const pagContainer = document.getElementById('paginationContainer');
      if (totalPages <= 1) {
        pagContainer.innerHTML = '';
        return;
      }

      let html = `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="px-2.5 py-1 rounded-lg border border-purple-200 bg-white text-[11px] text-slate-700 disabled:opacity-40"><i class="fas fa-chevron-left"></i></button>`;
      
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
          html += `<button onclick="goToPage(${i})" class="px-2.5 py-1 rounded-lg text-[11px] font-medium ${i === currentPage ? 'bg-theme-500 text-white' : 'border border-purple-200 bg-white text-slate-700'}">${i}</button>`;
        } else if (i === currentPage - 2 || i === currentPage + 2) {
          html += `<span class="text-slate-400 text-[11px] px-1">...</span>`;
        }
      }

      html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="px-2.5 py-1 rounded-lg border border-purple-200 bg-white text-[11px] text-slate-700 disabled:opacity-40"><i class="fas fa-chevron-right"></i></button>`;
      pagContainer.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      renderItems();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openModal(editMode = false) {
      if (!editMode) {
        document.getElementById('itemForm').reset();
        document.getElementById('editingItemId').value = '';
        document.getElementById('modalTitle').innerText = '新增零食貨品';
        document.getElementById('codeError').classList.add('hidden');
        document.getElementById('duplicateError').classList.add('hidden');
        document.getElementById('codeContainer').classList.remove('border-rose-500', 'ring-2', 'ring-rose-500');
        document.getElementById('itemCustomCategory').classList.add('hidden');
        document.getElementById('itemCustomCategory').required = false;
        
        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = false;
        saveBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        
        clearImagePreview();
      }
      updateCategoryOptions();
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    function editItem(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('editingItemId').value = id;
      document.getElementById('modalTitle').innerText = '編輯零食貨品';
      document.getElementById('itemSuffix').value = item.code ? item.code.replace('4000', '').trim() : '';
      document.getElementById('itemName').value = item.name || '';
      document.getElementById('itemPieceCount').value = item.pieceCount || '';
      
      updateCategoryOptions();
      const select = document.getElementById('itemCategorySelect');
      const customInput = document.getElementById('itemCustomCategory');

      if (item.category && Array.from(select.options).some(o => o.value === item.category)) {
        select.value = item.category;
        customInput.classList.add('hidden');
        customInput.required = false;
      } else if (item.category) {
        select.value = '__NEW__';
        customInput.value = item.category;
        customInput.classList.remove('hidden');
        customInput.required = true;
      }

      if (item.image && item.image.startsWith('data:image')) {
        currentBase64Image = item.image;
        document.getElementById('itemImage').value = '';
        setPreviewImageSrc(item.image);
      } else {
        currentBase64Image = '';
        document.getElementById('itemImage').value = item.image || '';
        setPreviewImageSrc(item.image || '');
      }

      openModal(true);
      validateSuffixInput();
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (file) {
        processImageFile(file);
      }
    }

    function handlePasteImage(e) {
      if (document.getElementById('itemModal').classList.contains('hidden')) return;
      const itemsList = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of itemsList) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          const blob = item.getAsFile();
          processImageFile(blob);
          break;
        }
      }
    }

    function processImageFile(file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 800;

          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          currentBase64Image = canvas.toDataURL('image/jpeg', 0.8);
          document.getElementById('itemImage').value = '';
          setPreviewImageSrc(currentBase64Image);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function previewImageSrc(url) {
      currentBase64Image = '';
      setPreviewImageSrc(url);
    }

    function setPreviewImageSrc(src) {
      const container = document.getElementById('imagePreviewContainer');
      const img = document.getElementById('imagePreview');
      if (src) {
        img.src = src;
        container.classList.remove('hidden');
      } else {
        container.classList.add('hidden');
      }
    }

    function clearImagePreview() {
      currentBase64Image = '';
      document.getElementById('itemImage').value = '';
      document.getElementById('imageFileInput').value = '';
      document.getElementById('imagePreviewContainer').classList.add('hidden');
    }

    function saveItem(e) {
      e.preventDefault();
      if (!validateSuffixInput()) return;

      const selectValue = document.getElementById('itemCategorySelect').value;
      const customValue = document.getElementById('itemCustomCategory').value.trim();
      let finalCategory = '';

      if (selectValue === '__NEW__') {
        if (!customValue) {
          alert('請輸入新類別名稱！');
          return;
        }
        finalCategory = customValue;
      } else if (selectValue) {
        finalCategory = selectValue;
      } else {
        alert('請選擇或輸入類別！');
        return;
      }

      const editId = document.getElementById('editingItemId').value;
      const targetCode = ('4000' + document.getElementById('itemSuffix').value).trim();
      const imageUrl = currentBase64Image || document.getElementById('itemImage').value;

      const itemData = {
        code: targetCode,
        name: document.getElementById('itemName').value,
        category: finalCategory,
        pieceCount: document.getElementById('itemPieceCount').value,
        image: imageUrl || ''
      };

      if (editId) {
        db.child(editId).update(itemData).then(() => closeModal());
      } else {
        db.push(itemData).then(() => closeModal());
      }
    }

    function deleteItem(id) {
      if (confirm('確定要刪除這筆零食資料嗎？')) {
        db.child(id).remove();
      }
    }
  </script></body></html>
